name: native

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "flatpak/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "backend/**"
      - "flatpak/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

env:
  GGB_REF: main

jobs:
  flatpak:
    name: Flatpak (native GJS + GTK4)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-gjs-${{ runner.os }}-${{ hashFiles('backend/build.sh') }}
          restore-keys: gradle-gjs-${{ runner.os }}-

      - name: Build GeoGebra GJS module
        run: bash backend/build.sh

      - name: Assemble Flatpak staging
        run: bash flatpak/assemble.sh

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=flatpak/repo flatpak/build-dir flatpak/io.github.lin_calvin.GJSGebra.yml
          flatpak build-bundle flatpak/repo GJSGebra.flatpak io.github.lin_calvin.GJSGebra

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: gjsgebra-flatpak
          path: GJSGebra.flatpak
          if-no-files-found: error
