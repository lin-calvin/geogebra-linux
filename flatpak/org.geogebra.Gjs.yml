app-id: org.geogebra.Gjs
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: ggb-gjs

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: geogebra-gjs
    buildsystem: simple
    build-commands:
      - install -Dm755 ggb-gjs /app/bin/ggb-gjs
      - mkdir -p /app/share/geogebra-gjs
      - cp -a host/. /app/share/geogebra-gjs/
      - cp ggbcanvas.nocache.js /app/share/geogebra-gjs/
      - install -Dm644 org.geogebra.Gjs.desktop /app/share/applications/org.geogebra.Gjs.desktop
      - install -Dm644 org.geogebra.Gjs.svg /app/share/icons/hicolor/scalable/apps/org.geogebra.Gjs.svg
    sources:
      - type: dir
        path: staging
