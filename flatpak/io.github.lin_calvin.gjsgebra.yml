app-id: io.github.lin_calvin.gjsgebra
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: gjsgebra

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: gjsgebra
    buildsystem: simple
    build-commands:
      - install -Dm755 gjsgebra /app/bin/gjsgebra
      - mkdir -p /app/share/gjsgebra
      - cp -a host/. /app/share/gjsgebra/
      - cp ggbcanvas.nocache.js /app/share/gjsgebra/
      - mkdir -p /app/share/fonts
      - cp -a fonts/. /app/share/fonts/
      - install -Dm644 io.github.lin_calvin.gjsgebra.desktop /app/share/applications/io.github.lin_calvin.gjsgebra.desktop
      - install -Dm644 io.github.lin_calvin.gjsgebra.metainfo.xml /app/share/metainfo/io.github.lin_calvin.gjsgebra.metainfo.xml
      - install -Dm644 io.github.lin_calvin.gjsgebra.svg /app/share/icons/hicolor/scalable/apps/io.github.lin_calvin.gjsgebra.svg
    sources:
      - type: dir
        path: staging
